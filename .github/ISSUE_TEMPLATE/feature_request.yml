name: Feature request
description: Suggest an improvement to surgent
title: "[Feature]: "
labels: [enhancement]
assignees: []
body:
  - type: markdown
    attributes:
      value: Describe the problem before proposing a solution.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of surgent would change?
      options:
        - Install, startup, or CLI flags
        - Agents and profiles (/agents, subagents)
        - Planning (/plan)
        - Code navigation (code_map, inspect)
        - Context optimization (output pruning and deduplication)
        - Permissions and .piignore
        - Checkpoints, rewind, and fork
        - Web search and fetch (/web-login)
        - MCP servers (/mcp)
        - TUI rendering or input
        - New tool or command
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What repository workflow or user need is not handled well today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: How should surgent address the problem?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or other approaches you considered, including how other coding agents handle it.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, screenshots, or related projects that clarify the request.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: I agree to follow the project's Code of Conduct.
          required: true
