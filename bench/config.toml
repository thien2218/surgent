[model]
name = "gpt-6.1-sol"
effort = "high"

[agents]
codex_version = "0.164.0"
opencode_version = "1.19.0"

[auth]
codex = "~/.codex/auth.json"
surgent = "~/.pi/agent/auth.json"
opencode = "~/.local/share/opencode/auth.json"

[run]
jobs_dir = "jobs"
agent_timeout_multiplier = 1.0
stall_minutes = 20
n_concurrent = 3
agent_hosts = ["chatgpt.com", "auth.openai.com", "models.dev"]
seed = 7
max_retries = 2
extra_instruction = "You are running non-interactively: nobody will answer questions or approve plans. Make reasonable assumptions, complete the task end to end, and verify your work before finishing."

# DeepSWE: 113 tasks
[[suites]]
name = "deepswe"
dataset = "datacurve/deep-swe"
ref = ""
exclude = [
    "claude-code-by-agents-recursive-delegation",
    "eicrud-keyset-pagination-cursor",
    "happy-dom-deterministic-intersectionobserver",
    "ink-grid-box-layout",
    "meriyah-explicit-resource-declarations",
    "fd-deterministic-multi-key-sorting",
    "kcp-go-multiplexed-kcp-streams",
    "go-critic-doc-link-checker",
    "happy-dom-abort-pending-body-reads",
]
agent_timeout_multiplier = 1.0
offset = 0
limit = 80

# Run as root with network before each agent installs; the grader shares the container.
[suites.setup_commands]
# Image's polars 1.40.1 deprecation fails 97 existing tests; pixi.lock has 1.39.0.
skrub-duration-encoding = ["pip install --no-cache-dir polars==1.39.0"]
# Image's pydantic 2.13.3 changes a model repr, failing a snapshot test; uv.lock has 2.12.5.
langchain-request-coalescing = ["pip install --no-cache-dir pydantic==2.12.5"]
# Image's polars 1.40.1 fails 6 existing tests; 1.39.0 was current at the base commit.
narwhals-rolling-window-suite = ["pip install --no-cache-dir polars==1.39.0"]
# Image lacks grpc-gateway/v2 v2.27.7 from go.mod, so even the base commit can't build offline.
prometheus-transactional-reload-status = [
    "cd /app && GOWORK=off go mod download github.com/grpc-ecosystem/grpc-gateway/v2@v2.27.7",
]
# Cargo's first run deletes cached crates unused for 3 months, which the offline grader then can't download.
pest-character-class-coalescing = [
    "printf '[cache]\\nauto-clean-frequency = \"never\"\\n' >> ~/.cargo/config.toml",
]
# Jest sizes its pool from the host's cores, not the trial's 2 CPUs, and the base timing tests fail under that load.
kea-atomic-signal-selectors = [
    "cd /app && npm pkg set jest.maxWorkers=2 --json",
]

# Terminal-Bench 4.0: 66 tasks
[[suites]]
name = "terminal-bench"
dataset = "terminal-bench/terminal-bench"
ref = "4.0.0"
agent_timeout_multiplier = 1.0
limit = 0
strip_agent_tests = false
